<div class="bloc exemple"><div class="bloc-label">Erreur d’accord verbal</div><p>Phrase proposée : <em>Puellae cantat.</em></p><p>Si <em>puellae</em> est ici le sujet au nominatif pluriel (« les jeunes filles »), le verbe doit être au pluriel : <em>cantant</em>.</p><p><strong>Correction :</strong> <em>Puellae cantant.</em> — Les jeunes filles chantent.</p></div>
<div class="bloc cas"><div class="bloc-label">Attention</div><p>Hors contexte, <em>puellae</em> peut avoir plusieurs analyses. La correction n’est valable que si l’énoncé précise qu’il s’agit du nominatif pluriel.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — corriger une phrase (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Quatre erreurs</div><p>Corrige : (1) <em>Agricolae in agrum laborant.</em> (2) <em>Puella bonus cantat.</em> (3) <em>Servus dominum laudant.</em> (4) <em>Nautae puellam amat.</em></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>(1) Lieu où = <em>in</em> + ablatif : <em>in agro</em>.</li><li>(2) <em>puella</em> est féminin : <em>bona</em>.</li><li>(3) Sujet singulier : <em>laudat</em>.</li><li>(4) Sujet pluriel (<em>nautae</em>, « les marins ») : <em>amant</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Ordre de contrôle : verbe ↔ sujet ; cas ↔ fonction ; adjectif ↔ nom ; préposition ↔ cas.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Un accord d’adjectif</div><p><em>Filius agricolae puellam bona videt.</em> Corrige.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>puellam</em> est à l’accusatif singulier féminin ; l’adjectif doit porter les mêmes marques : <em>bonam</em>.</li><li>Phrase corrigée : <em>Filius agricolae puellam bonam videt.</em></li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Adjectif : mêmes genre, nombre et cas que le nom.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Le verbe</div><p><em>Puellae cantat.</em> Corrige si <em>puellae</em> est sujet.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>puellae</em> sujet = nominatif pluriel → verbe pluriel : <em>cantant</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Sujet pluriel → verbe pluriel.</p></div></details></div></details>
`},
{title:"Civilisation romaine : répondre à partir du texte",content:`
<p class="vu-en">📍 Relier la langue aux textes, à la vie romaine, aux légendes et à l’histoire.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La question porte sur la famille, la vie quotidienne, les institutions, les croyances, les légendes, l’histoire de Rome ou le contexte d’un texte.</p></div>
<div class="bloc theorie"><div class="bloc-label">Comment construire une réponse</div><ol><li>Identifie le thème demandé.</li><li>Repère les informations du texte ou du cours.</li><li>Distingue ce qui est explicitement dit de ce que tu connais par ailleurs.</li><li>Réponds avec une information précise et une phrase claire.</li></ol></div>
<div class="bloc exemple"><div class="bloc-label">Exemple de question</div><p>« Quel indice du texte montre que l’action se déroule dans une famille ? »</p><p>Relève les mots qui désignent les membres de la famille ou leurs relations, puis explique leur rôle dans le passage.</p></div>
<div class="bloc astuce"><div class="bloc-label">Réflexe</div><p>Ne transforme pas une question de compréhension en récit général sur Rome. Réponds d’abord à la question et utilise le texte comme preuve lorsqu’il en fournit une.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — civilisation (2 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">La fondation de Rome</div><p><em>Romulus urbem condit. Urbs Roma vocatur.</em> (<em>condere</em> : fonder ; <em>urbs</em> : ville.) Qui fonde la ville ? Comment s’appelle-t-elle ? Quelle forme verbale justifie ta réponse ? Selon la tradition, en quelle année ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>Romulus</em> est le sujet de <em>condit</em> : c’est lui qui fonde la ville (<em>urbem</em> : accusatif, COD).</li><li><em>Roma vocatur</em> : <em>vocatur</em> est un passif (<strong class="cle">-tur</strong>) : « la ville est appelée Rome ».</li><li>La tradition romaine place la fondation en 753 av. J.-C.</li><li>Réponses justifiées par <em>condit</em> et <em>vocatur</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> <strong class="cle">-tur</strong> = passif ; sujet du verbe actif = celui qui agit.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">La famille romaine</div><p>Dans la famille romaine, qui est le <strong class="cle">pater familias</strong> ? Cite un indice de vocabulaire du texte latin qui montre une scène de famille.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Le <em>pater familias</em> est le chef de la famille : il exerce l’autorité sur les siens.</li><li>Dans un texte, les mots <em>pater, mater, filius, filia</em> montrent que la scène se passe en famille.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Répondre d’abord à la question, puis citer le texte.</p></div></details></div></details>
`},
{title:"Exercices combinés : version et thème d’épreuve",content:`
<p class="vu-en">📍 Vu en leçon : tous les chapitres précédents, utilisés ensemble dans une même phrase.</p>
<div class="bloc signal"><div class="bloc-label">La méthode des phrases d’épreuve</div><p>Une longue phrase latine n’est jamais une seule difficulté : ce sont plusieurs petites phrases emboîtées. <strong>1)</strong> Souligne les verbes conjugués. <strong>2)</strong> Découpe les propositions. <strong>3)</strong> Pour chaque verbe, trouve son sujet. <strong>4)</strong> Place les compléments (cas, prépositions). <strong>5)</strong> Traduis dans un français naturel. <strong>6)</strong> Vérifie accords et temps.</p></div>
<div class="bloc astuce"><div class="bloc-label">Le hack</div><p>Dans un thème, écris d’abord le <strong>verbe</strong>, puis son <strong>sujet</strong>, puis les <strong>compléments</strong> : on ne commence jamais par le premier mot français.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — combinés (4 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-combine">NIVEAU 4 — COMBINÉ</span><div class="exo-titre">Relative, datif et coordination</div><p><em>Puella, quae in villa habitat, rosas matri dat et cantat.</em> Traduis et analyse chaque verbe.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Trois verbes : <em>habitat</em>, <em>dat</em>, <em>cantat</em> (3ᵉ pers. sg, présent actif).</li><li><em>quae in villa habitat</em> : relative ; <em>quae</em> nominatif féminin singulier, sujet de <em>habitat</em>.</li><li>Principale : <em>puella rosas matri dat et cantat</em> : <em>rosas</em> accusatif pluriel (COD), <em>matri</em> datif singulier (destinataire), deux verbes coordonnés par <em>et</em>.</li><li>Traduction : La jeune fille qui habite dans la maison donne des roses à sa mère et chante.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Trois verbes = trois propositions ; <strong class="cle">matri</strong> (datif) avec <strong class="cle">dat</strong>.</p></div></details></div><div class="exo"><span class="niveau-tag niv-combine">NIVEAU 4 — COMBINÉ</span><div class="exo-titre">Passif et préposition</div><p><em>Agricola a nautis ad oppidum ducitur.</em> Traduis. (<em>ducere</em> : conduire.)</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>ducitur</em> : passif (<strong class="cle">-tur</strong>), 3ᵉ sg : « est conduit ». Sujet : <em>agricola</em>.</li><li><em>a nautis</em> : complément d’agent, ablatif pluriel : « par les marins ».</li><li><em>ad oppidum</em> : accusatif, direction : « à la ville ».</li><li>Traduction : Le paysan est conduit à la ville par les marins.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Passif + <strong class="cle">a + ablatif</strong> = « par » ; <strong class="cle">ad</strong> + accusatif = « vers ».</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Un thème complet</div><p>Traduis en latin : <strong class="cle">Les bons paysans donnent du pain aux petits garçons dans la ville.</strong></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Verbe : « donnent » = <em>dant</em>. Sujet : <em>agricolae boni</em> (nominatif pluriel masculin).</li><li>COD : <em>panem</em>. Destinataire : <em>pueris parvis</em> (datif pluriel masculin).</li><li>Lieu où : <em>in oppido</em> (in + ablatif).</li><li>Phrase : <em>Agricolae boni pueris parvis panem in oppido dant.</em></li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Pluriel partout ; « aux » → datif ; « dans la ville » → in + ablatif.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Relative et accords</div><p><em>Magistra, quam pueri amant, librum bonum puellis dat.</em> Analyse <em>quam</em> et traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>quam</em> : relatif féminin singulier (antécédent <em>magistra</em>), accusatif car COD de <em>amant</em> (sujet <em>pueri</em>, nominatif pluriel).</li><li><em>librum bonum</em> : accusatif singulier masculin, COD de <em>dat</em> ; <em>puellis</em> : datif pluriel.</li><li>Traduction : La maîtresse, que les garçons aiment, donne un bon livre aux jeunes filles.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Le relatif prend sa fonction dans sa proposition : <strong class="cle">quam</strong> = COD de <strong class="cle">amant</strong>.</p></div></details></div></details>`},
{title:"Synthèse — indices, décisions et pièges",content:`
<p class="vu-en">📍 Révision générale : choisir la démarche selon la forme de la question.</p>
<div class="bloc resume"><div class="bloc-label">Tableau de décision</div><table class="lecture"><thead><tr><th>Indice</th><th>Démarche</th><th>Piège</th></tr></thead><tbody><tr><td>« Quel cas ? »</td><td>Analyser terminaison et contexte</td><td>Confondre cas et fonction</td></tr><tr><td>« Quelle fonction ? »</td><td>Relier le mot au verbe ou au nom</td><td>Répondre seulement par le cas</td></tr><tr><td>« Analysez le verbe »</td><td>Personne, nombre, temps, mode, voix</td><td>Oublier voix ou nombre</td></tr><tr><td>« Traduisez »</td><td>Version : lire, analyser, traduire, vérifier</td><td>Traduire mot à mot</td></tr><tr><td>« Mettez en latin »</td><td>Thème : fonctions, cas, accords, conjugaison</td><td>Copier l’ordre français</td></tr><tr><td>« Corrigez »</td><td>Vérifier accords, cas et construction</td><td>Changer une terminaison au hasard</td></tr><tr><td>Plusieurs verbes</td><td>Délimiter les propositions</td><td>Mélanger les sujets</td></tr><tr><td>Mot inconnu</td><td>Contexte, nature et dictionnaire</td><td>Choisir le premier sens trouvé</td></tr></tbody></table></div>
<div class="bloc astuce"><div class="bloc-label">Routine d’examen</div><p><strong>1.</strong> Lis toute la consigne. <strong>2.</strong> Repère les verbes. <strong>3.</strong> Identifie cas et accords. <strong>4.</strong> Construis le sens. <strong>5.</strong> Rédige précisément. <strong>6.</strong> Vérifie les terminaisons et le français final.</p></div>
<div class="bloc defi"><div class="bloc-label">Défi de synthèse</div><p><em>Puella quam magistra laudat librum legit.</em></p><p>Repère le verbe principal, le pronom relatif, son antécédent, puis traduis. Plusieurs connaissances sont combinées.</p><details class="reponse"><summary>Voir une démarche possible</summary><div class="corrige"><p><em>Legit</em> est le verbe principal : « lit ». Son sujet est <em>puella</em>. <em>Quam</em> renvoie à <em>puella</em> et est COD de <em>laudat</em> dans la relative. <em>Magistra</em> est le sujet de <em>laudat</em>. <em>Librum</em> est COD de <em>legit</em>.</p><p>Traduction : « La jeune fille que la maîtresse loue lit un livre. »</p></div></details></div>`},

const questions = [
{text:"Dans « Analysez le verbe portant », quel travail est attendu ?",options:["Traduire toute la phrase","Donner personne, nombre, temps, mode et voix","Décliner le nom portare","Donner uniquement le sens"],correct:1,explication:"Analyser un verbe consiste à identifier ses caractéristiques grammaticales."},
{text:"Dans « Agricola filium vocat », quel mot est le verbe conjugué ?",options:["Agricola","Filium","Vocat","Aucun"],correct:2,explication:"Vocat vient de vocare et signifie « appelle »."},
{text:"Dans « Agricola filium vocat », quelle est la fonction de filium ?",options:["Sujet","COD","Complément du nom","Vocatif"],correct:1,explication:"Filium est à l’accusatif singulier et représente la personne appelée : COD de vocat."},
{text:"Le dictionnaire donne « puella, puellae ». Quelle déclinaison ?",options:["Première","Deuxième","Troisième","Aucune"],correct:0,explication:"Le génitif singulier puellae se termine par -ae : première déclinaison."},
{text:"Le dictionnaire donne « dominus, domini ». Quel indice permet de reconnaître la déclinaison ?",options:["Génitif en -ae","Génitif en -i","Génitif en -is","La traduction française"],correct:1,explication:"Le génitif domini se termine par -i : deuxième déclinaison."},
{text:"Le dictionnaire donne « rex, regis ». À quelle déclinaison appartient rex ?",options:["Première","Deuxième","Troisième","Impossible à savoir"],correct:2,explication:"Le génitif regis se termine par -is : troisième déclinaison."},
{text:"Dans « Puella rosam portat », quelle est la fonction de puella ?",options:["COD","Sujet","Datif","Complément du nom"],correct:1,explication:"Puella est au nominatif singulier et accomplit l’action : sujet."},
{text:"Dans « Puella rosam portat », pourquoi rosam est-il à l’accusatif ?",options:["C’est le sujet","C’est le COD","C’est le destinataire","C’est un verbe"],correct:1,explication:"La rose est ce que la jeune fille porte : COD à l’accusatif."},
{text:"Dans « Puella bona cantat », pourquoi bona est-il au féminin singulier nominatif ?",options:["Il s’accorde avec puella","Il s’accorde avec cantat","Il est toujours féminin","Il est au vocatif"],correct:0,explication:"Bona qualifie puella et s’accorde avec elle en genre, nombre et cas."},
{text:"Dans « Servi aquam portant », quelle analyse convient à portant ?",options:["2e personne singulier présent actif","3e personne pluriel présent actif","3e personne singulier présent passif","1re personne pluriel imparfait"],correct:1,explication:"La terminaison -nt indique la troisième personne du pluriel au présent actif."},
{text:"Dans « Puella laudatur », quelle est la voix de laudatur ?",options:["Active","Passive","Infinitive","Impérative"],correct:1,explication:"Laudatur est une forme passive : la jeune fille reçoit l’action."},
{text:"Quelle forme de esse signifie « nous sommes » ?",options:["Sum","Est","Sumus","Sunt"],correct:2,explication:"Sumus correspond à la première personne du pluriel."},
{text:"Dans « In villa habitat », quel sens le groupe in villa exprime-t-il ici ?",options:["Direction vers la maison","Lieu où l’on se trouve","Destinataire","Sujet"],correct:1,explication:"La phrase signifie « Il/elle habite dans la maison » : le groupe exprime le lieu."},
{text:"Dans « Ad villam ambulat », quel sens exprime ad villam ?",options:["Direction vers la maison","Origine","Sujet","COD de ambulat"],correct:0,explication:"Ad avec l’accusatif exprime ici la direction : vers la maison."},
{text:"Dans « Puella quam video cantat », à quoi renvoie quam ?",options:["Video","Cantat","Puella","À aucun mot"],correct:2,explication:"Quam est un pronom relatif dont l’antécédent est puella."},
{text:"Dans « Puella quam video cantat », quelle fonction a quam dans quam video ?",options:["Sujet de video","COD de video","Verbe principal","Complément du nom"],correct:1,explication:"La personne que je vois est l’objet de video : quam est COD dans la relative."},
{text:"Dans « Puer laborat et puella legit », combien de verbes conjugués repères-tu ?",options:["Un","Deux","Trois","Quatre"],correct:1,explication:"Laborat et legit sont deux verbes conjugués, dans deux propositions coordonnées."},
{text:"Quelle démarche convient avant de traduire un texte latin ?",options:["Traduire le dernier mot","Lire le passage pour saisir le sens général","Remplacer chaque mot par le premier sens du dictionnaire","Ignorer les verbes"],correct:1,explication:"La lecture globale permet de comprendre le passage avant l’analyse détaillée."},
{text:"Quelle traduction correspond à « Puella rosam matri dat » ?",options:["La mère donne une jeune fille à la rose","La jeune fille donne une rose à sa mère","La rose donne une mère à la jeune fille","La jeune fille voit sa mère"],correct:1,explication:"Puella est sujet, rosam COD, matri destinataire au datif et dat signifie « donne »."},
{text:"Dans le thème « La jeune fille loue le paysan », quelle forme correspond au COD « le paysan » ?",options:["Agricola","Agricolam","Agricolae","Agricolarum"],correct:1,explication:"Agricola est un nom masculin de première déclinaison ; à l’accusatif singulier : agricolam."},
{text:"Dans « Puellae cantant », si puellae est le sujet au nominatif pluriel, quelle forme verbale convient ?",options:["Cantat","Cantas","Cantant","Canto"],correct:2,explication:"Le sujet est à la troisième personne du pluriel ; le verbe doit être cantant."},
{text:"Pourquoi ne faut-il pas attribuer automatiquement la fonction de sujet au premier mot d’une phrase latine ?",options:["Le latin n’a pas de verbes","Les terminaisons et le contexte indiquent les fonctions","Tous les noms sont des COD","L’ordre est toujours inversé"],correct:1,explication:"L’ordre des mots peut varier. Les cas, les accords et le contexte indiquent les fonctions."},
{text:"Dans une question « Relevez le sujet et justifiez », quelle réponse est la plus complète ?",options:["Donner seulement la traduction","Nommer le mot et expliquer l’indice grammatical","Recopier la phrase sans commentaire","Donner le genre du verbe"],correct:1,explication:"La justification doit s’appuyer sur un indice grammatical, par exemple le nominatif et la relation avec le verbe."},
{text:"Après l’analyse des formes, que faut-il faire dans une version ?",options:["Réorganiser le sens en français correct sans ajouter ni supprimer d’information","Conserver obligatoirement l’ordre latin","Supprimer les compléments","Traduire seulement les noms"],correct:0,explication:"La version doit être fidèle au texte et produire un français correct."},
{text:"Dans une phrase à corriger, quel contrôle est pertinent ?",options:["Vérifier accords, cas et relation sujet-verbe","Changer toutes les terminaisons en -a","Remplacer tous les noms par des pronoms","Supprimer les prépositions"],correct:0,explication:"La correction grammaticale exige de vérifier les accords, les fonctions et les constructions."},
{text:"Dans « Puella quam magistra laudat librum legit », quel est le verbe principal ?",options:["Quam","Laudat","Legit","Magistra"],correct:2,explication:"Legit est le verbe de la principale : la jeune fille lit un livre. Laudat appartient à la relative."},
{text:"Dans « Puella quam magistra laudat librum legit », quel mot est le sujet de laudat ?",options:["Puella","Quam","Magistra","Librum"],correct:2,explication:"Dans la relative, magistra est au nominatif et accomplit l’action de louer."},
{text:"Quelle méthode convient à une question de compréhension sur un texte latin ?",options:["Répondre selon son imagination","Rechercher l’information dans le texte et justifier avec les indices","Traduire seulement le titre","Ignorer la consigne"],correct:1,explication:"La réponse doit s’appuyer sur le passage et les formes grammaticales qui confirment l’interprétation."},
{text:"Dans une analyse complète d’un nom, quelle distinction faut-il conserver ?",options:["Cas et fonction","Genre et traduction uniquement","Temps et voix","Mode et personne"],correct:0,explication:"Le cas décrit la forme grammaticale ; la fonction décrit le rôle du nom dans la phrase."},
{text:"Dans « Agricolam puella amat », qui aime ?",options:["Le paysan", "Les deux", "On ne peut pas savoir", "La jeune fille"],correct:3,explication:"Agricolam (-am) est à l’accusatif : c’est l’objet. Puella (nominatif) est le sujet : la jeune fille aime le paysan."},
{text:"Le dictionnaire donne « rex, regis ». Quelle déclinaison ?",options:["1ʳᵉ", "2ᵉ", "4ᵉ", "3ᵉ"],correct:3,explication:"Le génitif regis se termine par -is : 3ᵉ déclinaison."},
{text:"Dans « Puellae cantant », puellae est :",options:["Génitif singulier", "Datif singulier", "Accusatif pluriel", "Nominatif pluriel"],correct:3,explication:"Le verbe cantant est au pluriel, donc le sujet est au nominatif pluriel."},
{text:"Laudabantur se traduit par :",options:["Ils louaient", "Ils loueront", "Tu étais loué", "Ils étaient loués"],correct:3,explication:"-ba- : imparfait ; -ntur : 3ᵉ personne du pluriel, passif."},
{text:"Passe « Agricola terram arat » à la voix passive.",options:["Terram ab agricola aratur", "Terra agricolam aratur", "Agricola a terra aratur", "Terra ab agricola aratur"],correct:3,explication:"Le COD devient sujet au nominatif (terra), le sujet devient complément d’agent à l’ablatif (ab agricola) et le verbe passe au passif."},
{text:"« Nautae in insulam navigant » signifie :",options:["Les marins naviguent dans l’île", "Le marin navigue vers l’île", "L’île navigue vers les marins", "Les marins naviguent vers l’île"],correct:3,explication:"in + accusatif indique la direction : « vers ». Navigant est pluriel : « les marins »."},
{text:"Dans « Puer quem video librum legit », quem a pour fonction :",options:["COD de video", "Sujet de legit", "Complément du nom", "Datif"],correct:0,explication:"Quem répond à « que je vois » : accusatif, COD de video. Son antécédent est puer."},
{text:"Comment dit-on « Les marins aiment la reine » ?",options:["Nautam reginam amat", "Nautae regina amant", "Nautas reginae amant", "Nautae reginam amant"],correct:3,explication:"Sujet pluriel au nominatif (nautae), verbe pluriel (amant), COD à l’accusatif (reginam)."},
{text:"Corrige « Puella bonus cantat ».",options:["Puella bona cantat", "Puella bonum cantat", "Puellam bonus cantat", "Aucune correction"],correct:0,explication:"L’adjectif s’accorde avec puella : féminin singulier nominatif : bona."},
{text:"Dans « Dominus servo pecuniam dat », servo est :",options:["Nominatif", "Accusatif", "Datif", "Génitif"],correct:2,explication:"Le verbe dare appelle un destinataire : datif singulier, « à l’esclave »."},
{text:"Dans « Video pueros bonos », bonos est :",options:["Nominatif pluriel masculin", "Accusatif singulier masculin", "Datif pluriel féminin", "Accusatif pluriel masculin"],correct:3,explication:"Pueros est à l’accusatif pluriel masculin ; l’adjectif porte les mêmes marques."},
{text:"« Lupa pueros non necat » signifie :",options:["La louve ne tue pas les garçons", "La louve tue les garçons", "Les garçons ne tuent pas la louve", "La louve n’a pas de garçons"],correct:0,explication:"Non nie le verbe necat ; pueros est COD, lupa sujet."},
{text:"Dans « Agricola bonus filiam parvam laudat », qui est bon ?",options:["La fille", "La louange", "Le paysan", "Personne"],correct:2,explication:"Bonus (nominatif masculin) s’accorde avec agricola, un nom masculin malgré sa terminaison en -a."},
{text:"Dans « Puella rosas legit », legit signifie le plus naturellement :",options:["Elle lit", "Elle choisit un livre", "Elle écrit", "Elle cueille"],correct:3,explication:"Le COD rosas (des roses) oriente le sens de legere vers « cueillir »."}
];

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {

}

        q.options.forEach((o, k) => {

      while (text.length > max) {

        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
