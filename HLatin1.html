html, body { height:100%; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(160deg,var(--p1) 0%,var(--p2) 50%,var(--p3) 100%); display:flex; justify-content:center; align-items:center; padding:8px; }

/* ───── Banque d'exercices + phrases en couleurs ───── */

.mot.r-s{background:#e3f0ff}.mot.r-v{background:#fde7e7}.mot.r-o{background:#e6f4e7}.mot.r-d{background:#fff0e0}.mot.r-c{background:#f3e5f9}.mot.r-a{background:#e0f2f1}.mot.r-g{background:#efebe9}.mot.r-r{background:#fce4ec}

<script>
const COURSE_TITLE = "Latin 1";
// COURS 1 — Latin — HLatin1.html

const slides = [
{title:"Sommaire — Réussir les exercices de latin en 1H",content:`
<p class="vu-en">📍 Première année des humanités littéraires — 3e secondaire.</p>
<div class="bloc signal"><div class="bloc-label">Le rôle d’ECOLIA H</div><p>Le cours classique t’apprend la langue : formes, déclinaisons, conjugaisons, vocabulaire et règles. <strong>ECOLIA H t’apprend à utiliser ces connaissances dans une interrogation</strong> : reconnaître ce que la question demande, repérer les indices, choisir la règle utile, analyser puis traduire ou transformer.</p><p>Si une notion de base n’est pas comprise, retourne au cours classique de Latin 1H. Ici, nous travaillons surtout la manière de l’appliquer.</p></div>
<div class="bloc theorie"><div class="bloc-label">Compétences entraînées</div><ul><li>Reconnaître les cas, les fonctions et les formes verbales.</li><li>Analyser une phrase sans se fier uniquement à l’ordre des mots.</li><li>Faire une version (latin vers français) et un thème (français vers latin).</li><li>Répondre à des questions sur un texte et justifier ses choix.</li><li>Repérer et corriger une erreur grammaticale.</li></ul></div>
<div class="bloc cas"><div class="bloc-label">Périmètre et prudence curriculaire</div><p>Le Programme national de latin RDC consulté pour la 3e année cite notamment la valeur des cas, trois déclinaisons de substantifs, deux classes d’adjectifs, la conjugaison régulière active et passive à l’indicatif, <em>esse</em> et ses composés. Il prévoit aussi prépositions, conjonctions, pronoms personnels et relatifs.</p><p>Un support récent destiné à la 1re humanité annonce les cinq déclinaisons. L’étendue exacte doit donc être confirmée avec le manuel et le professeur de l’établissement. Cette version H n’impose pas de notions non confirmées.</p></div>
<div class="bloc theorie"><div class="bloc-label">Comment ce guide fonctionne</div><p>Chaque chapitre propose des repères et des exemples corrigés, puis une <strong>banque d’exercices d’interrogation</strong> à déplier, du plus difficile au plus simple. Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Cherche seul(e) avant d’ouvrir la correction.</p></div><div class="bloc resume"><div class="bloc-label">Méthode générale</div><p><strong>Lire → repérer → analyser → choisir la règle → traduire → vérifier.</strong></p></div>
<div class="sources"><strong>Références de cadrage :</strong> Programme national de latin RDC, EDIDEPS 2007, cycle long, section littéraire, partie 3e année ; « Le latin débutant — première des humanités littéraires », HKMSTD, 2026. ECOLIA H propose un entraînement méthodologique, pas une reproduction de ces documents.</div>`},
{title:"Lire la consigne avant de commencer",content:`
<p class="vu-en">📍 Comprendre exactement le travail demandé.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>Les verbes de consigne annoncent le travail : <strong>traduire, décliner, conjuguer, analyser, identifier, relever, justifier, compléter, transformer, corriger</strong>.</p></div>
<div class="bloc theorie"><div class="bloc-label">Toutes les formes d’exercices concernés</div><ul><li>Donner les six cas d’un nom : déclinaison.</li><li>Donner le cas et la fonction d’un mot : analyse grammaticale.</li><li>Passer du latin au français : version.</li><li>Passer du français au latin : thème.</li><li>Passer du singulier au pluriel : transformation.</li><li>Repérer une terminaison incorrecte : correction grammaticale.</li></ul></div>
<div class="bloc exemple"><div class="bloc-label">Deux consignes différentes</div><p>« Donnez le cas de <em>rosam</em> » demande d’identifier une forme grammaticale.</p><p>« Donnez la fonction de <em>rosam</em> dans <em>Puella rosam portat</em> » demande son rôle dans la phrase : complément d’objet direct.</p><p>Le cas et la fonction sont liés, mais ne désignent pas la même chose.</p></div>
<div class="bloc astuce"><div class="bloc-label">Réflexe</div><p>Repère le verbe de la consigne et demande-toi : « Quel résultat précis le professeur attend-il ? »</p></div>`},
{title:"Décoder une phrase latine",content:`
<p class="vu-en">📍 Observer les mots et leurs relations avant de traduire.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>L’ordre des mots ne ressemble pas au français, plusieurs terminaisons se ressemblent ou tu hésites sur celui qui accomplit l’action.</p></div>
<div class="bloc theorie"><div class="bloc-label">Les indices à examiner</div><ol><li>Repère le verbe conjugué.</li><li>Observe sa terminaison pour trouver personne et nombre.</li><li>Repère les noms et leurs terminaisons pour déterminer leurs cas.</li><li>Relie les adjectifs aux noms auxquels ils se rapportent.</li><li>Relis la phrase entière pour retrouver le sens logique.</li></ol></div>
<div class="bloc exemple"><div class="bloc-label">Exemple guidé</div><p><em>Agricola filium vocat.</em></p><p><strong>1.</strong> <em>vocat</em> : verbe, « appelle ».</p><p><strong>2.</strong> <em>agricola</em> : nominatif singulier, sujet, « le paysan ».</p><p><strong>3.</strong> <em>filium</em> : accusatif singulier, COD, « le fils ».</p><p><strong>Traduction :</strong> Le paysan appelle son fils.</p></div>
<div class="bloc cas"><div class="bloc-label">Piège</div><p>Ne traduis pas automatiquement le premier mot comme sujet. Les terminaisons et le contexte indiquent les fonctions ; l’ordre des mots peut varier.</p></div>
<div class="bloc exemple"><div class="bloc-label">Voir la phrase en couleurs</div><p class="phrase-leg"><span class="r-s">sujet</span> <span class="r-v">verbe</span> <span class="r-o">COD</span> <span class="r-d">datif</span> <span class="r-c">complément circonstanciel</span> <span class="r-a">adjectif</span> <span class="r-g">génitif</span> <span class="r-r">relatif</span></p><div class="phrase"><span class="mot r-s"><b>Nautae</b><small>nom. pl</small></span><span class="mot r-o"><b>puellam</b><small>acc. sg</small></span><span class="mot r-a"><b>bonam</b><small>acc. sg</small></span><span class="mot r-c"><b>in insula</b><small>in + abl.</small></span><span class="mot r-v"><b>vident</b><small>3ᵉ pers. pl</small></span></div><p class="phrase-trad">Les marins voient la bonne jeune fille dans l’île.</p></div><details class="banque"><summary>🎯 Banque d’exercices d’interrogation — décoder une phrase (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Un sujet au pluriel</div><p><em>Nautae in insula puellam bonam vident.</em> Traduis et justifie la fonction de <em>nautae</em>. (<em>nauta</em> : marin ; <em>insula</em> : île.)</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Verbe : <em>vident</em>, 3ᵉ personne du pluriel (vident = ils voient). Le sujet doit être au pluriel.</li><li><em>Nautae</em> peut être génitif ou datif singulier, ou nominatif pluriel. Seul le nominatif pluriel s’accorde avec <em>vident</em> : « les marins ».</li><li><em>puellam bonam</em> : accusatif singulier féminin, COD : « la bonne jeune fille ».</li><li><em>in insula</em> : ablatif (lieu où l’on est) : « dans l’île ».</li><li>Traduction : Les marins voient la bonne jeune fille dans l’île.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Verbe au pluriel (<em>-nt</em>) → sujet au pluriel ; <em>in</em> + ablatif → lieu où.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">L’ordre des mots trompe</div><p><em>Agricolam puella amat.</em> Qui aime qui ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Verbe : <em>amat</em>, 3ᵉ personne du singulier : « aime ».</li><li><em>Agricolam</em> se termine par <strong class="cle">-am</strong> : accusatif singulier, COD.</li><li><em>Puella</em> : nominatif singulier, sujet.</li><li>Traduction : La jeune fille aime le paysan. L’ordre latin ne décide pas du sujet.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Terminaison <em>-am</em> = accusatif = objet, même placé en tête de phrase.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Le génitif</div><p><em>Filius agricolae equum videt.</em> Traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Verbe : <em>videt</em> (il voit). Sujet : <em>filius</em> (nominatif).</li><li><em>Equum</em> : accusatif, COD : « le cheval ».</li><li><em>Agricolae</em> placé après <em>filius</em> : génitif, complément du nom : « du paysan ».</li><li>Traduction : Le fils du paysan voit le cheval.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Un nom au génitif suit le nom qu’il complète : « le fils <strong class="cle">du paysan</strong> ».</p></div></details></div></details>
`},
{title:"Cas et fonctions : poser les bonnes questions",content:`
<p class="vu-en">📍 Nominatif, vocatif, génitif, datif, accusatif et ablatif.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La consigne demande « quel cas ? », « quelle fonction ? », « qui fait l’action ? », « à qui ? », « de qui ? », « avec quoi ? » ou « où ? ».</p></div>
<div class="bloc theorie"><div class="bloc-label">Repères de départ</div><table class="lecture"><thead><tr><th>Cas</th><th>Question utile</th><th>Fonction fréquente</th></tr></thead><tbody><tr><td>Nominatif</td><td>Qui fait l’action ?</td><td>Sujet, attribut</td></tr><tr><td>Vocatif</td><td>À qui parle-t-on ?</td><td>Interpellation</td></tr><tr><td>Génitif</td><td>De qui ? De quoi ?</td><td>Complément du nom</td></tr><tr><td>Datif</td><td>À qui ? Pour qui ?</td><td>Complément d’attribution</td></tr><tr><td>Accusatif</td><td>Qui ? Quoi ? après le verbe</td><td>COD</td></tr><tr><td>Ablatif</td><td>Avec quoi ? Par quoi ? Où ?</td><td>Compléments circonstanciels selon le contexte</td></tr></tbody></table><p>Ce tableau donne des repères fréquents. Une préposition ou la construction du verbe peut imposer un cas particulier.</p></div>
<div class="bloc exemple"><div class="bloc-label">Plusieurs fonctions dans une phrase</div><p><em>Puella rosam matri dat.</em></p><ul><li><em>Puella</em> : nominatif, sujet.</li><li><em>Rosam</em> : accusatif, COD.</li><li><em>Matri</em> : datif, destinataire.</li><li><em>Dat</em> : verbe, « donne ».</li></ul><p><strong>Traduction :</strong> La jeune fille donne une rose à sa mère.</p></div>
<div class="bloc astuce"><div class="bloc-label">Réflexe d’examen</div><p>Donne les deux informations si elles sont demandées : le <strong>cas</strong> (forme grammaticale) et la <strong>fonction</strong> (rôle dans la phrase).</p></div>
<div class="bloc exemple"><div class="bloc-label">Voir la phrase en couleurs</div><div class="phrase"><span class="mot r-s"><b>Magister</b><small>nom. sg</small></span><span class="mot r-d"><b>discipulis</b><small>dat. pl</small></span><span class="mot r-o"><b>fabulam</b><small>acc. sg</small></span><span class="mot r-v"><b>narrat</b><small>3ᵉ pers. sg</small></span></div><p class="phrase-trad">Le maître raconte une histoire aux élèves.</p></div><details class="banque"><summary>🎯 Banque d’exercices d’interrogation — cas et fonctions (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Qui reçoit quoi ?</div><p><em>Magister discipulis fabulam narrat.</em> Donne le cas et la fonction de <em>discipulis</em> et de <em>fabulam</em>, puis traduis. (<em>discipulus</em> : élève ; <em>fabula</em> : histoire ; <em>narrare</em> : raconter.)</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Verbe : <em>narrat</em> (il raconte), sujet <em>magister</em> (nominatif).</li><li><em>fabulam</em> : accusatif singulier, COD : « une histoire ».</li><li><em>discipulis</em> : datif ou ablatif pluriel. Après <em>narrat</em>, on raconte quelque chose « à quelqu’un » : datif pluriel, complément d’attribution.</li><li>Traduction : Le maître raconte une histoire aux élèves.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Verbe de communication/don + un COD → le 2ᵉ nom est le destinataire (datif).</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Le destinataire</div><p><em>Dominus servo pecuniam dat.</em> Quel est le cas de <em>servo</em> ? Sa fonction ? Traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Verbe <em>dat</em> : donner. Il demande un objet (<em>pecuniam</em>, accusatif : « de l’argent ») et un destinataire.</li><li><em>servo</em> : datif singulier (2ᵉ déclinaison, <em>servus</em>), complément d’attribution.</li><li>Traduction : Le maître donne de l’argent à l’esclave.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> <em>dare</em> = donner → « à qui ? » → datif.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Cas et fonction</div><p>Dans <em>Puella rosam amat</em>, donne le cas et la fonction de <em>rosam</em>.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>rosam</em> se termine par <strong class="cle">-am</strong> : accusatif singulier.</li><li>Il répond à « qui ? / quoi ? » après le verbe : COD de <em>amat</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Cas = forme ; fonction = rôle. Donne les deux.</p></div></details></div></details>
`},
{title:"Reconnaître les déclinaisons dans une phrase",content:`
<p class="vu-en">📍 Reconnaître les formes nominales et leur déclinaison.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>On te donne un nom isolé, une forme comme <em>puellae</em>, <em>domini</em> ou <em>regem</em>, ou l’on demande de retrouver son nominatif, son génitif ou sa déclinaison.</p></div>
<div class="bloc theorie"><div class="bloc-label">Le génitif singulier : un indice essentiel</div><p>La forme de dictionnaire présente généralement le nominatif et le génitif singuliers, avec le genre. Le génitif aide à reconnaître la déclinaison.</p><table class="lecture"><thead><tr><th>Exemple</th><th>Génitif</th><th>Déclinaison</th></tr></thead><tbody><tr><td><em>puella, puellae</em></td><td>-ae</td><td>1re</td></tr><tr><td><em>dominus, domini</em></td><td>-i</td><td>2e</td></tr><tr><td><em>rex, regis</em></td><td>-is</td><td>3e</td></tr></tbody></table></div>
<div class="bloc exemple"><div class="bloc-label">Analyser « regem »</div><ol class="etapes"><li>Le dictionnaire donne <em>rex, regis</em>.</li><li>Le génitif <em>regis</em> se termine par -is : 3e déclinaison.</li><li><em>Regem</em> est l’accusatif singulier.</li><li>Dans une phrase, il peut être COD si la construction le confirme.</li></ol></div>
<div class="bloc cas"><div class="bloc-label">Piège fréquent</div><p>Une terminaison isolée peut correspondre à plusieurs cas. Vérifie le contexte et la forme de dictionnaire avant de conclure.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — reconnaître les déclinaisons (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Retrouver le nominatif</div><p>Pour chaque forme, donne le nominatif et le génitif du dictionnaire, la déclinaison, le cas et le nombre : <strong class="cle">regis</strong> (de <em>rex</em>), <strong class="cle">dominorum</strong> (de <em>dominus</em>), <strong class="cle">puellis</strong> (de <em>puella</em>).</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>regis</em> : rex, regis. Génitif en <strong class="cle">-is</strong> → 3ᵉ déclinaison. <em>regis</em> est le génitif singulier.</li><li><em>dominorum</em> : dominus, domini. Génitif en <strong class="cle">-i</strong> → 2ᵉ déclinaison. <em>-orum</em> : génitif pluriel.</li><li><em>puellis</em> : puella, puellae. Génitif en <strong class="cle">-ae</strong> → 1ʳᵉ déclinaison. <em>puellis</em> : datif ou ablatif pluriel (le contexte tranche).</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Génitif du dictionnaire : -ae = 1ʳᵉ, -i = 2ᵉ, -is = 3ᵉ.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Une forme, plusieurs analyses</div><p>Que peut être <em>rege</em> ? Et <em>reges</em> ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>rex, regis</em> : 3ᵉ déclinaison.</li><li><em>rege</em> : ablatif singulier (« par/avec/du roi »), la seule analyse possible.</li><li><em>reges</em> : nominatif pluriel ou accusatif pluriel ou vocatif pluriel. Il faut regarder le verbe et la phrase pour décider.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> En 3ᵉ déclinaison, nom. pl = acc. pl = <strong class="cle">-es</strong>.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Un mot de la 3ᵉ déclinaison</div><p>Le dictionnaire donne <em>miles, militis</em> (m.). Donne l’accusatif singulier et le datif pluriel.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Radical : <em>milit-</em> (pris au génitif).</li><li>Accusatif singulier : <em>militem</em>.</li><li>Datif pluriel : <em>militibus</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Le radical se prend au génitif, pas au nominatif.</p></div></details></div></details>
`},
{title:"Les noms : le tableau-réflexe des terminaisons",content:`
<p class="vu-en">📍 Vu en leçon : première, deuxième et troisième déclinaisons. Les tableaux complets sont dans le cours classique ; ici, tu t’en sers comme d’un tableau-réflexe.</p>
<div class="formule"><div class="f-nom">Le réflexe du génitif</div><div class="f-eq">-ae · -i · -is</div><div class="f-aide">Le génitif singulier du dictionnaire donne la déclinaison : -ae → 1ʳᵉ, -i → 2ᵉ, -is → 3ᵉ.</div><details class="symboles"><summary>Que signifie chaque symbole ?</summary><div class="sym-list"><div class="sym"><b>-ae</b><span>génitif singulier de la 1ʳᵉ déclinaison : <em>puella, puellae</em>.</span></div><div class="sym"><b>-i</b><span>génitif singulier de la 2ᵉ déclinaison : <em>dominus, domini</em>.</span></div><div class="sym"><b>-is</b><span>génitif singulier de la 3ᵉ déclinaison : <em>rex, regis</em>.</span></div></div></details></div>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>On te donne une forme isolée (<em>regis</em>, <em>dominorum</em>, <em>puellis</em>) et on demande le cas, le nombre, le nominatif ou la déclinaison. Ou bien on te demande d’écrire une forme : « donne l’accusatif pluriel ».</p></div>
<div class="bloc theorie"><div class="bloc-label">Tableau-réflexe — 1ʳᵉ déclinaison : puella, puellae (f.)</div><table class="lecture"><tr><th>Cas</th><th>Singulier</th><th>Pluriel</th></tr><tr><td>Nominatif</td><td>puell<b>a</b></td><td>puell<b>ae</b></td></tr><tr><td>Vocatif</td><td>puell<b>a</b></td><td>puell<b>ae</b></td></tr><tr><td>Génitif</td><td>puell<b>ae</b></td><td>puell<b>arum</b></td></tr><tr><td>Datif</td><td>puell<b>ae</b></td><td>puell<b>is</b></td></tr><tr><td>Accusatif</td><td>puell<b>am</b></td><td>puell<b>as</b></td></tr><tr><td>Ablatif</td><td>puell<b>a</b></td><td>puell<b>is</b></td></tr></table></div>
<div class="bloc theorie"><div class="bloc-label">Tableau-réflexe — 2ᵉ déclinaison : dominus, domini (m.)</div><table class="lecture"><tr><th>Cas</th><th>Singulier</th><th>Pluriel</th></tr><tr><td>Nominatif</td><td>domin<b>us</b></td><td>domin<b>i</b></td></tr><tr><td>Vocatif</td><td>domin<b>e</b></td><td>domin<b>i</b></td></tr><tr><td>Génitif</td><td>domin<b>i</b></td><td>domin<b>orum</b></td></tr><tr><td>Datif</td><td>domin<b>o</b></td><td>domin<b>is</b></td></tr><tr><td>Accusatif</td><td>domin<b>um</b></td><td>domin<b>os</b></td></tr><tr><td>Ablatif</td><td>domin<b>o</b></td><td>domin<b>is</b></td></tr></table></div>
<div class="bloc theorie"><div class="bloc-label">Tableau-réflexe — 3ᵉ déclinaison : rex, regis (m.)</div><table class="lecture"><tr><th>Cas</th><th>Singulier</th><th>Pluriel</th></tr><tr><td>Nominatif</td><td>rex</td><td>reg<b>es</b></td></tr><tr><td>Vocatif</td><td>rex</td><td>reg<b>es</b></td></tr><tr><td>Génitif</td><td>reg<b>is</b></td><td>reg<b>um</b></td></tr><tr><td>Datif</td><td>reg<b>i</b></td><td>reg<b>ibus</b></td></tr><tr><td>Accusatif</td><td>reg<b>em</b></td><td>reg<b>es</b></td></tr><tr><td>Ablatif</td><td>reg<b>e</b></td><td>reg<b>ibus</b></td></tr></table></div>
<div class="bloc cas"><div class="bloc-label">Les terminaisons qui trompent</div><table class="lecture"><tr><th>Terminaison</th><th>Peut être…</th><th>Comment trancher</th></tr><tr><td><b>-ae</b> (1ʳᵉ)</td><td>génitif sg, datif sg, nominatif pl</td><td>Verbe au pluriel → nominatif pl ; verbe de don + COD → datif ; nom devant → génitif</td></tr><tr><td><b>-is</b></td><td>datif/ablatif pl (1ʳᵉ, 2ᵉ) ; génitif sg (3ᵉ)</td><td>Préposition → ablatif ; destinataire → datif ; 3ᵉ déclinaison → génitif</td></tr><tr><td><b>-o</b> (2ᵉ)</td><td>datif sg ou ablatif sg</td><td>Préposition (cum, in, ex) → ablatif ; verbe dare → datif</td></tr><tr><td><b>-i</b> (2ᵉ)</td><td>génitif sg ou nominatif pl</td><td>Verbe au pluriel → nominatif ; nom devant → génitif</td></tr><tr><td><b>-a</b> (1ʳᵉ)</td><td>nominatif sg ou ablatif sg</td><td>Préposition devant → ablatif</td></tr><tr><td><b>-es</b> (3ᵉ)</td><td>nominatif pl ou accusatif pl</td><td>Sujet du verbe pluriel, ou COD</td></tr></table><p>Une terminaison seule ne suffit presque jamais : il faut le verbe, la préposition et la forme de dictionnaire.</p></div>
<div class="bloc exemple"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="bloc-label">Exemple corrigé</div><p>Quelle est la déclinaison de <em>regis</em> (dictionnaire : <em>rex, regis</em>) ?</p><ol class="etapes"><li>Dictionnaire : <em>rex, regis</em>. Le génitif est <em>regis</em>.</li><li>Il se termine par <strong>-is</strong> : 3ᵉ déclinaison.</li><li><em>Regis</em> est donc le génitif singulier de <em>rex</em> : « du roi ».</li></ol></div>
<div class="bloc exemple"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="bloc-label">Exemple corrigé</div><p>Donne le cas de <em>agricolae</em> dans : (1) <em>Filia agricolae cantat.</em> (2) <em>Puella agricolae rosam dat.</em> (3) <em>Agricolae in agro laborant.</em></p><ol class="etapes"><li>(1) Un nom (<em>filia</em>) précède <em>agricolae</em>, et le verbe est singulier : génitif singulier : « la fille du paysan ».</li><li>(2) <em>Dat</em> (donne) demande un destinataire ; <em>rosam</em> est le COD : <em>agricolae</em> est un datif singulier : « au paysan ».</li><li>(3) <em>Laborant</em> est au pluriel : <em>agricolae</em> est nominatif pluriel : « les paysans travaillent dans le champ ».</li></ol></div>
<div class="bloc astuce"><div class="bloc-label">Le hack</div><p>Le radical d’un nom se prend <strong>au génitif</strong>, jamais au nominatif : <em>rex, reg-is</em> → <em>regem, regibus</em>. Si tu pars de <em>rex</em>, tu inventes <em>rexem</em>.</p></div>
<div class="bloc defi"><div class="bloc-label">NIVEAU 3 — À toi de jouer</div><p><em>Equos agricolae vident.</em> Analyse <em>equos</em> et <em>agricolae</em>, puis traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><p><em>Equos</em> : accusatif pluriel (2ᵉ déclinaison, <em>equus</em>), COD. <em>Vident</em> est pluriel : <em>agricolae</em> est nominatif pluriel, sujet. Traduction : Les paysans voient les chevaux.</p></div></details></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — formes des noms (2 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Décliner un mot</div><p>Pour <em>rex, regis</em> donne : le génitif pluriel, le datif pluriel et l’accusatif pluriel.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Radical : <em>reg-</em>.</li><li>Génitif pluriel : <em>regum</em>.</li><li>Datif pluriel : <em>regibus</em>.</li><li>Accusatif pluriel : <em>reges</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Radical au génitif + <strong class="cle">-um / -ibus / -es</strong>.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Choisir parmi les analyses</div><p><em>Reges bonos laudamus.</em> Quel est le cas de <em>reges</em> ? Traduis. (<em>laudamus</em> : nous louons.)</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>laudamus</em> : 1ʳᵉ personne du pluriel : le sujet est « nous » (non écrit).</li><li><em>reges</em> ne peut donc pas être sujet : c’est l’accusatif pluriel, COD, accordé avec <em>bonos</em> (accusatif pluriel masculin).</li><li>Traduction : Nous louons les bons rois.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Un verbe en <strong class="cle">-mus</strong> a déjà son sujet : « nous ».</p></div></details></div></details>`},
{title:"Accord de l’adjectif avec le nom",content:`
<p class="vu-en">📍 Accord en genre, nombre et cas.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>Un nom est accompagné d’un adjectif ; on demande de relever le groupe nominal, d’accorder l’adjectif ou de corriger une terminaison.</p></div>
<div class="bloc theorie"><div class="bloc-label">Règle pratique</div><p>L’adjectif s’accorde avec le nom auquel il se rapporte en <strong>genre, nombre et cas</strong>. Il peut être placé avant ou après ce nom.</p><p>Les adjectifs de première classe présentent des formes comme <em>bonus, bona, bonum</em>. Les adjectifs de deuxième classe suivent d’autres modèles étudiés dans le cours classique.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple : groupe sujet</div><p><em>Puella bona cantat.</em></p><p><em>Puella</em> : féminin, singulier, nominatif. <em>Bona</em> : féminin, singulier, nominatif également.</p><p><strong>Traduction :</strong> La bonne jeune fille chante.</p></div>
<div class="bloc exemple"><div class="bloc-label">Même groupe au COD</div><p><em>Video puellam bonam.</em></p><p><em>Puellam</em> est à l’accusatif féminin singulier ; <em>bonam</em> porte les mêmes marques.</p><p><strong>Traduction :</strong> Je vois la bonne jeune fille.</p></div>
<div class="bloc astuce"><div class="bloc-label">Méthode</div><p>Repère le nom, détermine son genre, son nombre et son cas, puis vérifie que l’adjectif porte les marques correspondantes. Ne choisis pas l’accord uniquement parce que les mots sont proches.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — accord de l’adjectif (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Accorder trois adjectifs</div><p>Mets l’adjectif entre parenthèses à la bonne forme : (1) <em>Puella (pulcher) cantat.</em> (2) <em>Rosas (pulcher) video.</em> (3) <em>Dominus (bonus) servo (magnus) donum dat.</em></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>(1) <em>puella</em> : nominatif singulier féminin → <em>pulchra</em>.</li><li>(2) <em>rosas</em> : accusatif pluriel féminin → <em>pulchras</em>.</li><li>(3) <em>dominus</em> : nominatif singulier masculin → <em>bonus</em> ; <em>servo</em> : datif singulier masculin → <em>magno</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Adjectif = même genre, même nombre, même cas que son nom.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Un nom féminin… masculin</div><p><em>Agricola bonus filiam parvam laudat.</em> Traduis. Pourquoi <em>bonus</em> et non <em>bona</em> ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>Agricola</em> est masculin (un paysan) malgré sa terminaison en <strong class="cle">-a</strong>. L’adjectif prend donc la forme masculine : <em>bonus</em>.</li><li><em>filiam parvam</em> : accusatif singulier féminin (la petite fille). Les deux mots portent <em>-am</em>.</li><li>Traduction : Le bon paysan loue sa petite fille.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> On accorde avec le genre du nom, pas avec sa terminaison.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Le groupe au pluriel</div><p>Mets au pluriel : <strong class="cle">puella bona</strong> ; <strong class="cle">dominus bonus</strong> (nominatif).</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>puella bona</em> → <em>puellae bonae</em>.</li><li><em>dominus bonus</em> → <em>domini boni</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Le nom et l’adjectif changent ensemble.</p></div></details></div></details>
`},
{title:"Analyser un verbe sans deviner",content:`
<p class="vu-en">📍 Personne, nombre, temps, mode et voix.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La consigne dit « analysez le verbe », « donnez son infinitif », « identifiez le temps », « mettez au pluriel » ou « transformez à la voix passive ».</p></div>
<div class="bloc theorie"><div class="bloc-label">Les cinq informations à chercher</div><ol><li><strong>Personne :</strong> 1re, 2e ou 3e.</li><li><strong>Nombre :</strong> singulier ou pluriel.</li><li><strong>Temps :</strong> présent, imparfait, futur, etc., selon les formes étudiées.</li><li><strong>Mode :</strong> ici, l’indicatif dans les premiers exercices.</li><li><strong>Voix :</strong> active ou passive.</li></ol></div>
<div class="bloc exemple"><div class="bloc-label">Analyser « portant »</div><p><em>Portant</em> vient de <em>portare</em> : porter. La terminaison -nt indique la 3e personne du pluriel au présent de l’indicatif actif.</p><p><strong>Analyse :</strong> 3e personne, pluriel, présent, indicatif, voix active.</p><p>Dans <em>Servi aquam portant</em>, le sujet est <em>servi</em> : « les serviteurs portent de l’eau ».</p></div>
<div class="bloc astuce"><div class="bloc-label">Vérification</div><p>La personne du verbe doit correspondre au sujet. Si le sujet est pluriel, vérifie que le verbe est lui aussi au pluriel, sauf construction particulière.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — analyser un verbe (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Trois analyses</div><p>Analyse complètement : <strong class="cle">laudabantur</strong> ; <strong class="cle">vocabis</strong> ; <strong class="cle">habetis</strong>.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>laudabantur</em> (laudare) : <strong class="cle">-ba-</strong> = imparfait, <strong class="cle">-ntur</strong> = 3ᵉ personne du pluriel, voix passive : « ils étaient loués ».</li><li><em>vocabis</em> (vocare) : <strong class="cle">-bi-</strong> = futur, <strong class="cle">-s</strong> = 2ᵉ personne du singulier, voix active : « tu appelleras ».</li><li><em>habetis</em> (habere) : présent, <strong class="cle">-tis</strong> = 2ᵉ personne du pluriel, voix active : « vous avez ».</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> -ba- imparfait ; -bi-/-bo-/-bu- futur ; -ntur / -r passif ; -nt, -mus, -tis → pluriel.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Mettre au pluriel</div><p>Mets la phrase au pluriel : <em>Puella cantat.</em> puis <em>Agricola arat.</em></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Le sujet devient pluriel : <em>puella</em> → <em>puellae</em>, <em>agricola</em> → <em>agricolae</em>.</li><li>Le verbe passe à la 3ᵉ personne du pluriel : <em>cantat</em> → <em>cantant</em>, <em>arat</em> → <em>arant</em>.</li><li><em>Puellae cantant.</em> — <em>Agricolae arant.</em></li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Sujet pluriel → verbe en <strong class="cle">-nt</strong>.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Personne et nombre</div><p>Donne la personne et le nombre de <strong class="cle">portamus</strong>.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>-mus</em> : 1ʳᵉ personne du pluriel, présent actif : « nous portons ».</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> -mus = nous.</p></div></details></div></details>
`},
{title:"Voix active, voix passive et verbe esse",content:`
<p class="vu-en">📍 Conjugaison régulière à l’indicatif ; <em>esse</em> et ses composés.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>Tu dois dire qui accomplit l’action, qui la subit, reconnaître une terminaison passive ou analyser une forme de <em>sum</em>.</p></div>
<div class="bloc theorie"><div class="bloc-label">Différence de sens</div><p><strong>Active :</strong> le sujet fait l’action. <em>Agricola terram arat.</em> — Le paysan laboure la terre.</p><p><strong>Passive :</strong> le sujet subit l’action. <em>Terra ab agricola aratur.</em> — La terre est labourée par le paysan.</p><p>La forme du verbe et la construction permettent de distinguer les deux voix.</p></div>
<div class="bloc theorie"><div class="bloc-label">Le verbe esse : être</div><p>Présent : <em>sum</em> (je suis), <em>es</em> (tu es), <em>est</em> (il/elle est), <em>sumus</em> (nous sommes), <em>estis</em> (vous êtes), <em>sunt</em> (ils/elles sont).</p><p>Apprends le tableau complet dans le cours classique, puis entraîne-toi à reconnaître ces formes dans une phrase.</p></div>
<div class="bloc exemple"><div class="bloc-label">Repérer la voix</div><p><em>Puella laudatur.</em> <em>Laudatur</em> est passif : « la jeune fille est louée » ou « on loue la jeune fille », selon le contexte.</p></div>
<div class="bloc cas"><div class="bloc-label">Piège</div><p>Ne confonds pas le sujet grammatical et celui qui réalise l’action. À la voix passive, le sujet grammatical reçoit l’action.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — voix active et passive (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Actif → passif</div><p>Passe à la voix passive : <em>Agricola terram arat.</em> et <em>Nautae insulam vident.</em></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Le COD devient sujet au nominatif : <em>terram</em> → <em>terra</em>.</li><li>Le sujet devient complément d’agent : ablatif avec <em>a / ab</em> : <em>ab agricola</em>.</li><li>Le verbe passe au passif et s’accorde avec le nouveau sujet : <em>Terra ab agricola aratur.</em></li><li>Même méthode : <em>Insula a nautis videtur.</em> (<em>a</em> devant consonne, <em>ab</em> devant voyelle.)</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> COD → sujet ; sujet → <strong class="cle">a / ab</strong> + ablatif ; verbe en -tur / -ntur.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Traduire un passif</div><p><em>Puellae a magistra laudabantur.</em> Traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>laudabantur</em> : imparfait, 3ᵉ pers. pl, passif : « étaient louées ».</li><li><em>puellae</em> : sujet au nominatif pluriel (verbe pluriel).</li><li><em>a magistra</em> : complément d’agent, ablatif : « par la maîtresse ».</li><li>Traduction : Les jeunes filles étaient louées par la maîtresse.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> -ntur → sujet pluriel ; <strong class="cle">a + ablatif</strong> = « par ».</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Le verbe être</div><p>Écris en latin : « nous sommes », « ils étaient », « tu seras ».</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Présent : <em>sumus</em>.</li><li>Imparfait : <em>erant</em>.</li><li>Futur : <em>eris</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> esse : sum, es, est, sumus, estis, sunt.</p></div></details></div></details>
`},
{title:"Les verbes : le tableau-réflexe des terminaisons",content:`
<p class="vu-en">📍 Vu en leçon : conjugaison régulière active et passive à l’indicatif ; <em>esse</em>. Modèle : la 1ʳᵉ conjugaison, <em>laudare</em>. Les autres conjugaisons sont à revoir dans le cours classique.</p>
<div class="formule"><div class="f-nom">Radical + terminaison</div><div class="f-eq">laud- + -ba- + -ntur</div><div class="f-aide">Le radical donne le sens ; la terminaison donne le temps, la personne, le nombre et la voix.</div><details class="symboles"><summary>Que signifie chaque symbole ?</summary><div class="sym-list"><div class="sym"><b>laud-</b><span>le radical de <em>laudare</em> : « louer ».</span></div><div class="sym"><b>-ba-</b><span>le signe de l’imparfait (« -ais » en français).</span></div><div class="sym"><b>-ntur</b><span>3ᵉ personne du pluriel, voix passive.</span></div></div></details></div>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>« Analyse la forme verbale », « mets au pluriel », « passe au passif », « conjugue au futur », ou une forme à reconnaître dans un texte à traduire.</p></div>
<div class="bloc theorie"><div class="bloc-label">Tableau-réflexe — présent, imparfait, futur (1ʳᵉ conjugaison)</div><p><strong>Voix active</strong></p><table class="lecture mini"><tr><th>Personne</th><th>Présent</th><th>Imparfait</th><th>Futur</th></tr><tr><td>1ʳᵉ sg</td><td>laud<b>o</b></td><td>laud<b>abam</b></td><td>laud<b>abo</b></td></tr><tr><td>2ᵉ sg</td><td>laud<b>as</b></td><td>laud<b>abas</b></td><td>laud<b>abis</b></td></tr><tr><td>3ᵉ sg</td><td>laud<b>at</b></td><td>laud<b>abat</b></td><td>laud<b>abit</b></td></tr><tr><td>1ʳᵉ pl</td><td>laud<b>amus</b></td><td>laud<b>abamus</b></td><td>laud<b>abimus</b></td></tr><tr><td>2ᵉ pl</td><td>laud<b>atis</b></td><td>laud<b>abatis</b></td><td>laud<b>abitis</b></td></tr><tr><td>3ᵉ pl</td><td>laud<b>ant</b></td><td>laud<b>abant</b></td><td>laud<b>abunt</b></td></tr></table><p><strong>Voix passive</strong></p><table class="lecture mini"><tr><th>Personne</th><th>Présent</th><th>Imparfait</th><th>Futur</th></tr><tr><td>1ʳᵉ sg</td><td>laud<b>or</b></td><td>laud<b>abar</b></td><td>laud<b>abor</b></td></tr><tr><td>2ᵉ sg</td><td>laud<b>aris</b></td><td>laud<b>abaris</b></td><td>laud<b>aberis</b></td></tr><tr><td>3ᵉ sg</td><td>laud<b>atur</b></td><td>laud<b>abatur</b></td><td>laud<b>abitur</b></td></tr><tr><td>1ʳᵉ pl</td><td>laud<b>amur</b></td><td>laud<b>abamur</b></td><td>laud<b>abimur</b></td></tr><tr><td>2ᵉ pl</td><td>laud<b>amini</b></td><td>laud<b>abamini</b></td><td>laud<b>abimini</b></td></tr><tr><td>3ᵉ pl</td><td>laud<b>antur</b></td><td>laud<b>abantur</b></td><td>laud<b>abuntur</b></td></tr></table></div>
<div class="bloc theorie"><div class="bloc-label">Tableau-réflexe — esse (être) et parfait actif de laudare</div><table class="lecture mini"><tr><th>Personne</th><th>esse : présent</th><th>esse : imparfait</th><th>esse : futur</th><th>Parfait actif</th></tr><tr><td>1ʳᵉ sg</td><td>sum</td><td>eram</td><td>ero</td><td>laud<b>avi</b></td></tr><tr><td>2ᵉ sg</td><td>es</td><td>eras</td><td>eris</td><td>laud<b>avisti</b></td></tr><tr><td>3ᵉ sg</td><td>est</td><td>erat</td><td>erit</td><td>laud<b>avit</b></td></tr><tr><td>1ʳᵉ pl</td><td>sumus</td><td>eramus</td><td>erimus</td><td>laud<b>avimus</b></td></tr><tr><td>2ᵉ pl</td><td>estis</td><td>eratis</td><td>eritis</td><td>laud<b>avistis</b></td></tr><tr><td>3ᵉ pl</td><td>sunt</td><td>erant</td><td>erunt</td><td>laud<b>averunt</b></td></tr></table><p>Le parfait passif se forme avec un participe et <em>sum</em> : à voir dans le cours classique si ton manuel l’étudie.</p></div>
<div class="bloc exemple"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="bloc-label">Exemple corrigé</div><p>Analyse <em>portamus</em>.</p><ol class="etapes"><li><em>Port-</em> : radical de <em>portare</em> (« porter »).</li><li>Terminaison <strong>-mus</strong> : 1ʳᵉ personne du pluriel, sans <em>-ba-</em> ni <em>-bi-</em> : présent, voix active.</li><li>Analyse : 1ʳᵉ pers. pl, présent, indicatif, actif : « nous portons ».</li></ol></div>
<div class="bloc exemple"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="bloc-label">Exemple corrigé</div><p>Analyse <em>laudabimur</em> et <em>vocabantur</em>.</p><ol class="etapes"><li><em>Laudabimur</em> : <strong>-bi-</strong> = futur ; <strong>-mur</strong> = 1ʳᵉ pers. pl passive : « nous serons loués ».</li><li><em>Vocabantur</em> : <strong>-ba-</strong> = imparfait ; <strong>-ntur</strong> = 3ᵉ pers. pl passive : « ils étaient appelés ».</li></ol></div>
<div class="bloc astuce"><div class="bloc-label">Le hack</div><p><strong>-nt</strong> = ils · <strong>-mus</strong> = nous · <strong>-tis</strong> = vous. <strong>-r, -ris, -tur, -mur, -mini, -ntur</strong> = voix passive. <strong>-ba-</strong> = imparfait ; <strong>-bi- / -bo- / -bu-</strong> = futur.</p></div>
<div class="bloc cas"><div class="bloc-label">Pièges et fausses pistes</div><p><em>Laudabis</em> (futur actif, « tu loueras ») et <em>laudaris</em> (présent passif, « tu es loué ») se ressemblent : repère le <strong>-bi-</strong>.</p><p><em>Amat</em> (il aime) et <em>amant</em> (ils aiment) : un seul -n- change le sujet.</p></div>
<div class="bloc defi"><div class="bloc-label">NIVEAU 3 — À toi de jouer</div><p>Mets <em>portare</em> à la 3ᵉ personne du pluriel du futur passif, puis à la 1ʳᵉ personne du singulier de l’imparfait actif.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><p>Futur passif 3ᵉ pl : <em>portabuntur</em>. Imparfait actif 1ʳᵉ sg : <em>portabam</em>.</p></div></details></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — formes verbales (2 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Reconnaître quatre formes</div><p>Analyse : <strong class="cle">amabat</strong> ; <strong class="cle">amabitis</strong> ; <strong class="cle">amantur</strong> ; <strong class="cle">amaris</strong>.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>amabat</em> : <strong class="cle">-ba-</strong> imparfait, <strong class="cle">-t</strong> 3ᵉ sg, actif : « il aimait ».</li><li><em>amabitis</em> : <strong class="cle">-bi-</strong> futur, <strong class="cle">-tis</strong> 2ᵉ pl, actif : « vous aimerez ».</li><li><em>amantur</em> : présent, <strong class="cle">-ntur</strong> 3ᵉ pl, passif : « ils sont aimés ».</li><li><em>amaris</em> : présent, <strong class="cle">-ris</strong> 2ᵉ sg, passif : « tu es aimé ».</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Cherche d’abord <strong class="cle">-ba- / -bi-</strong>, puis la terminaison de personne, puis -r (passif).</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Conjuguer</div><p>À partir de <em>portare</em> écris : le présent passif à la 1ʳᵉ pers. pl, l’imparfait actif à la 3ᵉ pers. sg, le futur actif à la 2ᵉ pers. pl.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Présent passif 1ʳᵉ pl : <em>portamur</em>.</li><li>Imparfait actif 3ᵉ sg : <em>portabat</em>.</li><li>Futur actif 2ᵉ pl : <em>portabitis</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Radical + signe de temps + terminaison de personne.</p></div></details></div></details>`},
{title:"Prépositions et compléments circonstanciels",content:`
<p class="vu-en">📍 Reconnaître la préposition et le cas qu’elle commande.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La phrase contient <em>in, ad, cum, per, ab</em> ou une autre préposition ; la question demande où, vers où, avec qui, par où ou par qui.</p></div>
<div class="bloc theorie"><div class="bloc-label">Comment procéder ?</div><ol><li>Repère la préposition.</li><li>Identifie le nom ou le pronom qui la suit.</li><li>Vérifie dans le cours classique le cas exigé.</li><li>Traduis le groupe selon le contexte : lieu, direction, accompagnement, moyen ou origine.</li></ol><p>Certaines prépositions se construisent avec l’accusatif, d’autres avec l’ablatif ; certaines peuvent changer de sens selon le cas.</p></div>
<div class="bloc exemple"><div class="bloc-label">Deux sens différents</div><p><em>In villa habitat.</em> — Il/elle habite dans la maison : lieu où l’on se trouve.</p><p><em>Ad villam ambulat.</em> — Il/elle marche vers la maison : direction.</p><p>Le cas aide à comprendre la différence.</p></div>
<div class="bloc astuce"><div class="bloc-label">Réflexe</div><p>Ne traduis pas une préposition isolément sans examiner son cas et le verbe de la phrase.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — prépositions (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Où ? Vers où ?</div><p>Choisis la bonne forme : (1) <em>Servi in (villa / villam) laborant.</em> (2) <em>Servi in (villa / villam) ambulant.</em> (3) <em>Puer cum (amicis / amicos) ludit.</em></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>(1) Ils travaillent à l’intérieur : lieu où → ablatif : <em>in villa</em>.</li><li>(2) Ils vont vers la maison : direction → accusatif : <em>in villam</em>.</li><li>(3) <em>cum</em> + ablatif (accompagnement) : <em>cum amicis</em> : « avec ses amis ».</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> « in » + ablatif = où ; « in » + accusatif = vers où ; « cum » + ablatif.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Trois prépositions</div><p><em>Agricola cum filio ex agro ad oppidum ambulat.</em> Traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>ambulat</em> : il marche (3ᵉ sg). Sujet <em>agricola</em>.</li><li><em>cum filio</em> : ablatif, accompagnement : « avec son fils ».</li><li><em>ex agro</em> : ablatif, origine : « hors du champ ».</li><li><em>ad oppidum</em> : accusatif, direction : « vers la ville ».</li><li>Traduction : Le paysan marche avec son fils, du champ vers la ville.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Chaque préposition commande un cas : <strong class="cle">cum / ex</strong> + ablatif, <strong class="cle">ad</strong> + accusatif.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Quel cas ?</div><p>Quel cas après <strong class="cle">ad</strong> ? après <strong class="cle">cum</strong> ? après <strong class="cle">ab</strong> ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>ad : accusatif.</li><li>cum : ablatif.</li><li>ab : ablatif.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> À retenir dans le cours classique.</p></div></details></div></details>
`},
{title:"Pronoms personnels et pronoms relatifs",content:`
<p class="vu-en">📍 Identifier le pronom, son antécédent et sa fonction.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La phrase contient <em>ego, tu, nos, vos</em> ou <em>qui, quae, quod</em> ; la consigne demande d’identifier le pronom, son antécédent ou sa fonction.</p></div>
<div class="bloc theorie"><div class="bloc-label">Pronom personnel</div><p>Il désigne une personne sans répéter son nom. Le sujet peut être compris grâce à la terminaison du verbe même si le pronom n’est pas écrit.</p><p><em>Ego laboro.</em> — Moi, je travaille. <em>Nos laboramus.</em> — Nous travaillons.</p></div>
<div class="bloc theorie"><div class="bloc-label">Pronom relatif</div><p>Il introduit une proposition relative et renvoie à un nom déjà mentionné, appelé antécédent. Son genre et son nombre se rapportent à l’antécédent ; son cas dépend de sa fonction dans la relative.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><em>Puella quam video cantat.</em></p><p><em>Quam</em> renvoie à <em>puella</em>. Dans <em>quam video</em>, il est COD de « je vois » : accusatif féminin singulier.</p><p><strong>Traduction :</strong> La jeune fille que je vois chante.</p></div>
<div class="bloc astuce"><div class="bloc-label">Piège</div><p>Ne donne pas le cas du pronom relatif uniquement à partir de son antécédent. Cherche sa fonction dans sa propre proposition.</p></div>
<div class="bloc exemple"><div class="bloc-label">Voir la phrase en couleurs</div><div class="phrase"><span class="mot r-s"><b>Puer</b><small>nom. sg · antécédent</small></span><span class="mot r-r"><b>quem</b><small>acc. sg · COD de video</small></span><span class="mot r-v"><b>video</b><small>1ʳᵉ pers. sg</small></span><span class="mot r-o"><b>librum</b><small>acc. sg</small></span><span class="mot r-v"><b>legit</b><small>3ᵉ pers. sg</small></span></div><p class="phrase-trad">Le garçon que je vois lit un livre.</p></div><details class="banque"><summary>🎯 Banque d’exercices d’interrogation — pronoms (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Le relatif sujet</div><p><em>Servi qui in agro laborant dominum amant.</em> Analyse <em>qui</em> et traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Deux verbes : <em>laborant</em> et <em>amant</em>.</li><li><em>qui</em> : pronom relatif, masculin pluriel (comme son antécédent <em>servi</em>), nominatif car il est sujet de <em>laborant</em>.</li><li><em>dominum</em> : accusatif, COD de <em>amant</em>.</li><li>Traduction : Les esclaves qui travaillent dans le champ aiment leur maître.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Genre et nombre = antécédent ; cas = fonction dans la relative.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Le relatif COD</div><p><em>Puer quem video librum legit.</em> Traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>quem</em> : masculin singulier (antécédent <em>puer</em>), accusatif car COD de <em>video</em> (« que je vois »).</li><li>Principale : <em>puer librum legit</em>.</li><li>Traduction : Le garçon que je vois lit un livre.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Dans la relative, <strong class="cle">quem</strong> répond à « qui je vois ? » → COD.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Pronoms personnels</div><p><em>Ego te laudo, tu me laudas.</em> Traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>ego</em> : je ; <em>te</em> : te ; <em>tu</em> : tu ; <em>me</em> : me.</li><li>Traduction : Je te loue, tu me loues.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> te / me = accusatif, COD.</p></div></details></div></details>
`},
{title:"Coordination et subordination : découper la phrase",content:`
<p class="vu-en">📍 Repérer les propositions et les mots qui les relient.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La phrase contient plusieurs verbes conjugués, une conjonction ou une proposition introduite par un mot de liaison.</p></div>
<div class="bloc theorie"><div class="bloc-label">Méthode de repérage</div><ol><li>Souligne les verbes conjugués.</li><li>Repère les mots de liaison.</li><li>Associe chaque verbe à son sujet et à ses compléments.</li><li>Délimite les propositions.</li><li>Traduis les relations entre elles sans supprimer d’information.</li></ol></div>
<div class="bloc exemple"><div class="bloc-label">Exemple simple</div><p><em>Puer laborat et puella legit.</em></p><p>Deux verbes : <em>laborat</em> et <em>legit</em>. La conjonction <em>et</em> relie deux propositions coordonnées.</p><p><strong>Traduction :</strong> Le garçon travaille et la jeune fille lit.</p></div>
<div class="bloc cas"><div class="bloc-label">Piège</div><p>Ne traite pas la phrase comme une seule suite de mots. Repère les propositions pour ne pas attribuer un sujet ou un complément au mauvais verbe.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — propositions (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Relative + coordination</div><p><em>Puella, quae in villa habitat, rosas amat et cantat.</em> Découpe et traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Trois verbes : <em>habitat</em>, <em>amat</em>, <em>cantat</em>.</li><li>Relative : <em>quae in villa habitat</em> : <em>quae</em> (nominatif féminin) est le sujet de <em>habitat</em>.</li><li>Principale : <em>puella rosas amat et cantat</em> : deux verbes coordonnés par <em>et</em>, un seul sujet.</li><li>Traduction : La jeune fille qui habite dans la maison aime les roses et chante.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Compter les verbes conjugués = compter les propositions ; <strong class="cle">et</strong> coordonne.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">La cause</div><p><em>Puellae cantant quia laetae sunt.</em> Traduis (<em>quia</em> : parce que ; <em>laetus</em> : joyeux).</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Deux verbes : <em>cantant</em> et <em>sunt</em>.</li><li><em>quia</em> introduit la cause.</li><li><em>laetae</em> : attribut, nominatif pluriel féminin, accordé avec le sujet <em>puellae</em>.</li><li>Traduction : Les jeunes filles chantent parce qu’elles sont joyeuses.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> <strong class="cle">quia</strong> = parce que → proposition de cause.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Compter les propositions</div><p><em>Servus venit et dominum vocat.</em> Combien de propositions ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Verbes conjugués : <em>venit</em> et <em>vocat</em>.</li><li>2 propositions coordonnées par <em>et</em>, un seul sujet : <em>servus</em>.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> 1 verbe conjugué = 1 proposition.</p></div></details></div></details>
`},
{title:"Version : traduire du latin au français",content:`
<p class="vu-en">📍 Exercice de version : lire, analyser et traduire.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La consigne présente un texte latin et demande « traduisez », « donnez le sens du passage » ou « rendez le texte en français correct ».</p></div>
<div class="bloc theorie"><div class="bloc-label">Les six étapes</div><ol class="etapes"><li><strong>Lire tout le passage.</strong> Cherche le sens général avant de traduire chaque mot.</li><li><strong>Repérer les verbes.</strong> Ils permettent de distinguer les actions et les propositions.</li><li><strong>Identifier les formes.</strong> Cherche les cas, les accords et les pronoms.</li><li><strong>Construire les groupes.</strong> Relie chaque adjectif à son nom et chaque complément au mot qu’il complète.</li><li><strong>Traduire le sens.</strong> Réorganise la phrase en français naturel sans inventer ni supprimer d’information.</li><li><strong>Relire.</strong> Vérifie personnes, temps, négations, accords et liens logiques.</li></ol></div>
<div class="bloc astuce"><div class="bloc-label">Important</div><p>Le programme national recommande une lecture expressive pour saisir le sens général, puis une traduction précise et correcte. Il ne faut pas traduire mot à mot sans comprendre la phrase.</p></div>
<div class="bloc cas"><div class="bloc-label">Dictionnaire</div><p>Après avoir observé la phrase et identifié la forme, vérifie le sens du mot dans son contexte. Un mot peut avoir plusieurs sens ; la phrase aide à choisir.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — version (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Un petit texte</div><p><em>Lupa parvos pueros in silva videt. Lupa pueros non necat, sed pueros curat. Postea pastor pueros ad villam portat.</em> Traduis. (<em>lupa</em> : louve ; <em>necare</em> : tuer ; <em>curare</em> : s’occuper de ; <em>postea</em> : ensuite ; <em>pastor</em> : berger.)</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Lis tout : une louve et des enfants, puis un berger. Trois verbes principaux, un par phrase.</li><li>Phrase 1 : <em>lupa</em> sujet ; <em>parvos pueros</em> accusatif pluriel masculin (COD) ; <em>in silva</em> ablatif, lieu où.</li><li>Phrase 2 : <em>non necat, sed curat</em> : négation + opposition ; même sujet, même COD.</li><li>Phrase 3 : <em>pastor</em> sujet ; <em>ad villam</em> accusatif : direction.</li><li>Traduction : La louve voit les petits garçons dans la forêt. La louve ne les tue pas, mais elle s’occupe d’eux. Ensuite, le berger porte les garçons vers la ferme.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> <strong class="cle">non … sed</strong> = ne … pas, mais ; <strong class="cle">ad</strong> + accusatif = vers.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Un datif et une relative</div><p><em>Agricola, qui in agro laborat, filio parvo panem dat.</em> Traduis. (<em>panis</em> : pain.)</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>qui in agro laborat</em> : relative, <em>qui</em> sujet de <em>laborat</em>, antécédent <em>agricola</em>.</li><li><em>dat</em> : donne ; <em>panem</em> : accusatif, COD ; <em>filio parvo</em> : datif singulier, destinataire.</li><li>Traduction : Le paysan, qui travaille dans le champ, donne du pain à son petit fils.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Verbe <strong class="cle">dat</strong> → un COD et un destinataire au datif.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Une phrase simple</div><p><em>Puer librum legit.</em> Traduis.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>puer</em> : sujet ; <em>librum</em> : COD ; <em>legit</em> : il lit.</li><li>Traduction : Le garçon lit un livre.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Sujet – verbe – COD.</p></div></details></div></details>
`},
{title:"Version corrigée : appliquer la méthode",content:`
<p class="vu-en">📍 Analyser puis traduire une phrase courte.</p>
<div class="bloc cas"><div class="bloc-label">Énoncé</div><p><em>Puella rosam matri dat.</em></p><p>Traduis et justifie le rôle de chaque mot.</p></div>
<div class="bloc exemple"><div class="bloc-label">Résolution étape par étape</div><ol class="etapes"><li><strong>Verbe :</strong> <em>dat</em>, forme de <em>dare</em>, signifie « donne » ; 3e personne du singulier au présent.</li><li><strong>Sujet :</strong> <em>puella</em>, nominatif singulier : « la jeune fille ».</li><li><strong>Objet donné :</strong> <em>rosam</em>, accusatif singulier : « une rose ».</li><li><strong>Destinataire :</strong> <em>matri</em>, datif singulier : « à la mère ».</li><li><strong>Français :</strong> sujet + verbe + objet + destinataire.</li></ol><p><strong>Traduction :</strong> La jeune fille donne une rose à sa mère.</p></div>
<div class="bloc theorie"><div class="bloc-label">Ce qu’il fallait reconnaître</div><p>Le sens ne vient pas simplement de l’ordre latin. Les terminaisons <em>-a</em>, <em>-am</em> et <em>-i</em> donnent des indices sur les fonctions.</p></div>
<div class="bloc astuce"><div class="bloc-label">Vérification</div><p>Le sujet est singulier et le verbe à la 3e personne du singulier. Le destinataire est conservé en français.</p></div>`},
{title:"Thème : construire une phrase en latin",content:`
<p class="vu-en">📍 Exercice de thème : passer du français au latin.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La consigne donne une phrase française et demande sa traduction en latin, de compléter une phrase ou de remplacer un mot par une autre forme.</p></div>
<div class="bloc theorie"><div class="bloc-label">La démarche</div><ol><li>Comprends précisément la phrase française.</li><li>Repère le sujet, le verbe et les compléments.</li><li>Choisis les mots latins et vérifie leur forme de dictionnaire.</li><li>Détermine le cas nécessaire pour chaque nom ou pronom.</li><li>Accorde les adjectifs avec leurs noms.</li><li>Conjugue le verbe selon la personne, le nombre, le temps et la voix.</li><li>Relis toutes les terminaisons.</li></ol></div>
<div class="bloc cas"><div class="bloc-label">Attention</div><p>Ne transforme pas mécaniquement chaque mot français en un mot latin. Il faut comprendre la fonction de chaque groupe, puis construire une phrase latine correcte.</p></div>
<div class="bloc astuce"><div class="bloc-label">Contrôle rapide</div><p>Le sujet est-il au nominatif ? Le COD porte-t-il le cas attendu ? L’adjectif est-il accordé ? Le verbe correspond-il au sujet ?</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — thème (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Deux phrases à construire</div><p>Traduis en latin : (1) <strong class="cle">Les marins aiment la reine.</strong> (2) <strong class="cle">Les jeunes filles louent les bons paysans.</strong></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>(1) Sujet pluriel : <em>nautae</em> (nominatif pluriel). Verbe : <em>amant</em>. COD singulier : <em>reginam</em>. → <em>Nautae reginam amant.</em></li><li>(2) Sujet : <em>puellae</em>. Verbe : <em>laudant</em>. COD : <em>agricolas</em> (accusatif pluriel, masculin) et <em>bonos</em> (accusatif pluriel masculin). → <em>Puellae agricolas bonos laudant.</em></li><li>Contrôle : sujets pluriels → verbes en -nt ; COD à l’accusatif ; adjectif accordé en genre, nombre et cas.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Pluriel → sujet en <strong class="cle">-ae</strong>, verbe en <strong class="cle">-nt</strong> ; COD → accusatif.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Quatre compléments</div><p>Traduis en latin : <strong class="cle">Le paysan donne du pain au petit garçon dans la maison.</strong></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Sujet : <em>agricola</em> (nominatif). Verbe : <em>dat</em>.</li><li>COD : <em>panem</em> (accusatif). Destinataire : <em>puero parvo</em> (datif singulier).</li><li>Lieu où : <em>in villa</em> (in + ablatif).</li><li>Phrase : <em>Agricola puero parvo panem in villa dat.</em></li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> « à » + personne → datif ; « dans » (lieu où) → in + ablatif.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Singulier et pluriel</div><p>Traduis : <strong class="cle">La jeune fille chante.</strong> puis <strong class="cle">Les jeunes filles chantent.</strong></p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>Puella cantat.</em></li><li><em>Puellae cantant.</em></li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Un sujet pluriel entraîne un verbe pluriel.</p></div></details></div></details>
`},
{title:"Thème corrigé : choisir les bonnes formes",content:`
<p class="vu-en">📍 Traduire une phrase française simple en latin.</p>
<div class="bloc cas"><div class="bloc-label">Énoncé</div><p>Traduis : « La jeune fille loue le paysan. »</p></div>
<div class="bloc exemple"><div class="bloc-label">Résolution étape par étape</div><ol class="etapes"><li><strong>Sujet :</strong> « la jeune fille » ; <em>puella</em>, nominatif féminin singulier.</li><li><strong>Verbe :</strong> « loue » ; <em>laudat</em>, 3e personne du singulier au présent actif.</li><li><strong>COD :</strong> « le paysan » ; <em>agricola</em> est masculin malgré sa terminaison en -a. À l’accusatif singulier : <em>agricolam</em>.</li><li><strong>Assemblage :</strong> <em>Puella agricolam laudat.</em></li></ol><p><strong>Traduction :</strong> La jeune fille loue le paysan.</p></div>
<div class="bloc theorie"><div class="bloc-label">Pourquoi « agricolam » ?</div><p><em>Agricola</em> est un nom masculin de première déclinaison. Comme il est COD, on utilise l’accusatif singulier en -am. Le genre ne se déduit donc pas uniquement de la terminaison.</p></div>
<div class="bloc astuce"><div class="bloc-label">Piège</div><p>Ne laisse pas le nom au nominatif parce qu’il se termine en -a dans le dictionnaire. C’est sa fonction dans la phrase qui détermine le cas.</p></div>`},
{title:"Vocabulaire : choisir le sens grâce au contexte",content:`
<p class="vu-en">📍 Vocabulaire de base et sens des mots en contexte.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>Un mot est inconnu, possède plusieurs sens possibles, apparaît dans une expression ou ressemble à un mot français sans avoir exactement le même sens.</p></div>
<div class="bloc theorie"><div class="bloc-label">Procédure</div><ol><li>Observe la forme du mot et sa terminaison.</li><li>Détermine sa nature probable : nom, verbe, adjectif, pronom…</li><li>Regarde les mots qui l’entourent.</li><li>Choisis le sens compatible avec la phrase entière.</li><li>Relis la traduction pour vérifier qu’elle est logique.</li></ol></div>
<div class="bloc exemple"><div class="bloc-label">Exemple de raisonnement</div><p>Un mot désignant une personne peut être sujet s’il est au nominatif ; il peut être COD s’il est à l’accusatif après un verbe transitif. La fonction aide à choisir le sens qui convient.</p><p>Le dictionnaire donne des possibilités ; c’est la phrase qui permet de retenir le bon sens.</p></div>
<div class="bloc cas"><div class="bloc-label">À ne pas faire</div><p>N’apprends pas une longue liste de mots sans les replacer dans des phrases. Le programme national recommande de travailler le vocabulaire à partir des textes et de leur contexte.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — vocabulaire en contexte (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Un verbe, deux sens</div><p><em>Puella rosas legit.</em> / <em>Puella librum legit.</em> (<em>legere</em> : cueillir, lire, choisir). Choisis le sens dans chaque phrase.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>rosas</em> : des roses, que l’on cueille. → « La jeune fille cueille des roses. »</li><li><em>librum</em> : un livre, que l’on lit. → « La jeune fille lit un livre. »</li><li>Le COD indique le sens du verbe.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Le <strong class="cle">COD</strong> oriente le sens du verbe.</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Un nom, plusieurs sens</div><p><em>Romani terram amant.</em> (<em>terra</em> : terre, sol, pays). Quel sens est le plus naturel ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Le sujet est un peuple : les Romains.</li><li>On aime son pays, sa patrie plus naturellement que « le sol ».</li><li>Traduction possible : Les Romains aiment leur terre / leur pays. Le contexte du texte décide.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Un sens se choisit avec la phrase entière.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Faux amis</div><p>Que signifie <em>agricola</em> : « agriculteur », « paysan » ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>agricola</em> désigne celui qui cultive la terre : un paysan, un cultivateur.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Le dictionnaire propose, le contexte dispose.</p></div></details></div></details>
`},
{title:"Questions de compréhension sur un texte",content:`
<p class="vu-en">📍 Comprendre un texte et répondre avec précision.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>Après un texte, les questions commencent par « qui ? », « que fait… ? », « où ? », « pourquoi ? », « relevez… », « justifiez… » ou « expliquez le sens de… ».</p></div>
<div class="bloc theorie"><div class="bloc-label">Méthode</div><ol><li>Relis la question et repère le mot interrogatif.</li><li>Retourne au passage qui contient l’information.</li><li>Identifie les formes grammaticales qui confirment le sens.</li><li>Réponds exactement, sans raconter tout le texte.</li><li>Si une justification est demandée, cite le mot ou la construction qui sert d’indice.</li></ol></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><em>Puella librum legit. Puer eam audit.</em></p><p>Question : « Qui lit le livre ? » Repère <em>legit</em> (« lit »), puis son sujet <em>puella</em> (« la jeune fille »).</p><p><strong>Réponse :</strong> C’est la jeune fille qui lit le livre.</p></div>
<div class="bloc astuce"><div class="bloc-label">Réflexe</div><p>Une bonne réponse est exacte et appuyée sur le texte. Ne réponds pas uniquement à partir de ce que tu imagines.</p></div>
<details class="banque"><summary>🎯 Banque d’exercices d’interrogation — compréhension (3 exercices, du plus dur au plus simple)</summary><p class="banque-note">Les mots <strong class="cle">surlignés</strong> sont les indices qui te disent quelle règle appliquer. Analyse seul(e), écris ta réponse, puis ouvre la correction.</p><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 5 — TYPE ÉPREUVE</span><div class="exo-titre">Texte et questions</div><p><em>Lucia in villa habitat. Lucia rosas amat. Pater Luciae in horto laborat ; mater cibum parat.</em> (<em>hortus</em> : jardin ; <em>cibus</em> : nourriture ; <em>parare</em> : préparer.) Où habite Lucia ? Que fait le père ? Que prépare la mère ? Justifie avec un mot latin.</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li>Où ? <em>in villa</em> : ablatif de lieu → dans la maison.</li><li>Le père : <em>pater Luciae</em> (le père de Lucia, génitif) <em>in horto laborat</em> → il travaille dans le jardin.</li><li>La mère : <em>cibum parat</em> → elle prépare la nourriture (COD à l’accusatif).</li><li>Chaque réponse s’appuie sur un mot du texte.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Mot interrogatif + forme latine qui répond (<strong class="cle">in horto</strong>, <strong class="cle">cibum</strong>).</p></div></details></div><div class="exo"><span class="niveau-tag niv-difficile">NIVEAU 3 — DIFFICILE</span><div class="exo-titre">Le destinataire</div><p><em>Servus qui in oppido habitat dominum amat. Dominus servo equum dat.</em> Qui habite en ville ? Qui reçoit le cheval ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>qui in oppido habitat</em> : l’esclave (antécédent <em>servus</em>).</li><li><em>servo</em> : datif → celui qui reçoit ; <em>equum</em> accusatif : le cheval est ce qui est donné.</li><li>Réponses : l’esclave habite en ville ; l’esclave reçoit le cheval.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> <strong class="cle">servo</strong> (datif) = destinataire.</p></div></details></div><div class="exo"><span class="niveau-tag niv-facile">NIVEAU 2 — FACILE</span><div class="exo-titre">Qui fait quoi ?</div><p><em>Puella librum legit. Puer eam audit.</em> Qui lit ?</p><details class="reponse"><summary>Voir la correction</summary><div class="corrige"><ol class="etapes"><li><em>legit</em> : il/elle lit ; son sujet est <em>puella</em> (nominatif).</li><li>Réponse : c’est la jeune fille qui lit.</li></ol><p class="cle-lien">🔑 <strong>Indices → décision :</strong> Verbe → son sujet au nominatif.</p></div></details></div></details>
`},
{title:"Corriger une phrase : retrouver l’erreur",content:`
<p class="vu-en">📍 Repérer une forme incompatible avec la fonction ou l’accord attendu.</p>
<div class="bloc signal"><div class="bloc-label">Quand intervient-il ? — indices à reconnaître</div><p>La consigne demande de corriger, compléter, remplacer une forme, expliquer une faute ou choisir entre plusieurs terminaisons.</p></div>
<div class="bloc theorie"><div class="bloc-label">Ordre de vérification</div><ol><li>Le verbe est-il accordé avec son sujet ?</li><li>Le nom porte-t-il le cas correspondant à sa fonction ?</li><li>L’adjectif s’accorde-t-il avec le nom ?</li><li>La préposition commande-t-elle le bon cas ?</li><li>Le pronom relatif a-t-il la bonne fonction dans sa proposition ?</li></ol></div>
